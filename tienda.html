<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store | Nueva Colección 2026</title>
    <link rel="stylesheet" href="tienda.css">
</head>
<body>
    <div class="promo-top">ENVÍO GRATIS EN COMPRAS MAYORES A $150.000</div>
    <nav class="shop-nav">
        <div class="logo">FASHION<span>S</span></div>
        <div class="icons">🔍 🛒 👤</div>
    </nav>
    <header class="shop-hero">
        <div class="hero-info">
            <span class="tag">Temporada Invierno</span>
            <h1>Elegancia en <span>Cada Detalle</span></h1>
            <p>Descubre lo último en tendencias internacionales.</p>
            <a href="#shop" class="btn-shop">Comprar Ahora</a>
        </div>
    </header>
    <section id="shop" class="products">
        <div class="container">
            <h2>Nuevos Ingresos</h2>
            <div class="p-grid">
                <div class="p-card"><div class="img-p">🧥</div><h3>Abrigo Wool</h3><span>$180.000</span></div>
                <div class="p-card"><div class="img-p">👕</div><h3>Camisa Lino</h3><span>$85.000</span></div>
                <div class="p-card"><div class="img-p">👟</div><h3>Sneakers Pro</h3><span>$120.000</span></div>
            </div>
        </div>
    </section>
</body>
</html>
